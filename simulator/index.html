<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perrongskylt Simulator</title>
<style>
:root{color-scheme:dark;--bg:#11130f;--edge:#343a2c;--ink:#e5e7dd;--muted:#9a9e8e;--amber:#ff9a24;--green:#9dc36b;--red:#e0735a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 44px}
.eyebrow{color:var(--amber);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
h1{font-size:26px;margin:4px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.housing{background:#050605;border:1px solid #303328;border-radius:6px;padding:14px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.statusbar{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:10px 0 22px}
.ok{color:var(--green)}.bad{color:var(--red)}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}
label{font-size:13px;color:var(--muted)}
input,select{width:100%;min-height:42px;border:1px solid var(--edge);border-radius:3px;background:#10120f;color:var(--ink);padding:8px 10px;font:inherit}
input[type=range]{padding:0;accent-color:var(--amber)}
.help{font-size:12px;color:var(--muted)}
h2{font-size:15px;color:var(--amber);text-transform:uppercase;letter-spacing:1px;margin:30px 0 12px}
.buttons{display:flex;flex-wrap:wrap;gap:10px}
button{min-height:42px;border:1px solid var(--edge);border-radius:3px;background:#1b1e18;color:var(--ink);font:inherit;font-size:14px;padding:0 14px;cursor:pointer}
button.primary{background:var(--amber);border-color:var(--amber);color:#17130b;font-weight:700}
button[aria-pressed=true]{border-color:var(--red);color:var(--red)}
pre{background:#0b0c0a;border:1px solid var(--edge);padding:10px;font-size:12px;color:var(--muted);max-height:180px;overflow:auto;margin:0;white-space:pre-wrap}
.topbar{display:flex;justify-content:space-between;align-items:end;gap:12px}
#lang{width:auto;min-height:34px;padding:4px 8px;font-size:13px}
.warn{color:#e0b05a}
@media(max-width:560px){form{grid-template-columns:1fr}.wide{grid-column:auto}.topbar{flex-direction:column;align-items:start}}
</style>
</head>
<body>
<main>
<div class="topbar">
  <div><div class="eyebrow">Stockholm · Tunnelbana · Simulator</div><h1 data-t="title"></h1></div>
  <select id="lang" aria-label="Språk / Language / Idioma"><option value="sv">Svenska</option><option value="en">English</option><option value="es">Español</option></select>
</div>
<p class="sub" data-t="sub"></p>

<div class="housing"><canvas id="panel" width="768" height="192"></canvas></div>
<div class="statusbar">
  <span id="fetchStatus"></span>
  <span id="lastFetch"></span>
  <span id="nextFetch"></span>
</div>

<h2 data-t="hDisplay"></h2>
<form id="display">
  <div class="field wide"><label for="site" data-t="station"></label><select id="site"></select><span class="help" data-t="stationHelp"></span></div>
  <div class="field"><label for="platform" data-t="platform"></label><select id="platform"></select><span class="help" data-t="platformHelp"></span><span class="help warn" id="platformWarn"></span></div>
  <div class="field"><label for="line" data-t="line"></label><select id="line"></select><span class="help" data-t="lineHelp"></span></div>
  <div class="field"><label for="rows" data-t="rows"></label><select id="rows"><option value="1" data-t="row1"></option><option value="2" data-t="row2" selected></option></select><span class="help" data-t="rowsHelp"></span></div>
  <div class="field"><label for="brightness"><span data-t="brightness"></span> · <output id="brightnessValue">64</output>/255</label><input id="brightness" type="range" min="1" max="255" value="64"><span class="help" data-t="brightnessHelp"></span></div>
</form>

<h2 data-t="hTest"></h2>
<div class="buttons">
  <button type="button" class="primary" id="fetchNow" data-t="fetchNow"></button>
  <button type="button" id="offline" aria-pressed="false"></button>
  <button type="button" id="skip" data-t="skip"></button>
</div>

<h2 data-t="hLog"></h2>
<pre id="log"></pre>
</main>

const config = { site: 9116, platform: '2', line: '', rows: 2, brightness: 64 };
let stopData = { departures: [], stopName: '' };
let lastFetchOk = false, lastFetchMs = 0, lastSuccessMs = 0, clockOffset = 0;
let offline = false, platforms = [];

const now = () => Date.now() + clockOffset;
function log(msg) {
  const t = new Date().toLocaleTimeString('sv-SE');
  $('log').textContent = `[${t}] ${msg}\n` + $('log').textContent;
}

// ---- StockholmTheme::panelText: UTF-8 -> upper-case CP437 ----
const CP437 = { 'Å': 0x8F, 'å': 0x8F, 'Ä': 0x8E, 'ä': 0x8E, 'Ö': 0x99, 'ö': 0x99,
                'É': 0x90, 'é': 0x90, 'Ü': 0x9A, 'ü': 0x9A };
function panelText(text) {
  const out = [];
  for (const ch of text) {
    const code = ch.codePointAt(0);
    if (code < 0x80) out.push(ch.toUpperCase().charCodeAt(0));
    else if (CP437[ch]) out.push(CP437[ch]);
  }
  return out;
}
// ---- Framebuffer + Adafruit_GFX::drawChar at text size 1 ----
let frame = new Uint8Array(PANEL_W * PANEL_H);
// Optional clip window, like the GFXcanvas1 the firmware uses for marquees.
let clip = null;
function setPixel(px, py, value) {
  if (px < 0 || px >= PANEL_W || py < 0 || py >= PANEL_H) return;
  if (clip && (px < clip.x || px >= clip.x + clip.w || py < clip.y || py >= clip.y + clip.h)) return;
  frame[py * PANEL_W + px] = value;
}
function drawText(x, y, codes) {
  for (const c of codes) {
    for (let i = 0; i < 5; i++) {
      let bits = FONT[c * 5 + i];
      for (let j = 0; j < 8; j++, bits >>= 1) {
        if (bits & 1) setPixel(x + i, y + j, 1);
      }
    }
    // StockholmTheme::drawText lifts the umlaut dots of Ä (0x8E) and Ö (0x99) one pixel,
    // and lifts the whole Å (0x8F) one pixel so it sits on the same baseline as A.
    if (c === 0x8E || c === 0x99) {
      for (const dx of [x, x + 4]) {
        setPixel(dx, y, 0);
        setPixel(dx, y - 1, 1);
      }
    } else if (c === 0x8F) {
      for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 8; j++) setPixel(x + i, y + j, 0);
        for (let j = 0, bits = FONT[c * 5 + i]; j < 8; j++, bits >>= 1) if (bits & 1) setPixel(x + i, y + j - 1, 1);
      }
    }
    x += CHAR_W;
  }
}

// ---- StockholmTheme marquee: text too long for its window scrolls right-to-left ----
const TIME_GAP = 4, MARQUEE_GAP = 3 * CHAR_W, MARQUEE_STEP_MS = 40, MARQUEE_PAUSE_MS = 2000;
let marquees = [null, null];
const textWidth = codes => codes.length ? codes.length * CHAR_W - 1 : 0;

function placeText(x, y, width, codes, slot) {
  if (textWidth(codes) <= width) { marquees[slot] = null; drawText(x, y, codes); return; }
  const key = codes.join(',');
  const old = marquees[slot];
  const same = old && old.key === key && old.x === x && old.y === y && old.width === width;
  if (!same) marquees[slot] = { x, y, width, codes, key, offset: 0, nextStepMs: performance.now() + MARQUEE_PAUSE_MS };
  drawMarquee(marquees[slot]);
}

function drawMarquee(m) {
  // Same window as the firmware's 9-row GFXcanvas1: one extra row for lifted umlaut dots.
  clip = { x: m.x, y: m.y - 1, w: m.width, h: 9 };
  for (let py = clip.y; py < clip.y + clip.h; py++) for (let px = clip.x; px < clip.x + clip.w; px++) setPixel(px, py, 0);
  const cycle = textWidth(m.codes) + 1 + MARQUEE_GAP;
  drawText(m.x - m.offset, m.y, m.codes);
  drawText(m.x + cycle - m.offset, m.y, m.codes);
  clip = null;
}

function animate() {
  const t = performance.now();
  let changed = false;
  for (const m of marquees) {
    if (!m || t < m.nextStepMs) continue;
    const cycle = textWidth(m.codes) + 1 + MARQUEE_GAP;
    m.offset = (m.offset + 1) % cycle;
    m.nextStepMs = t + (m.offset === 0 ? MARQUEE_PAUSE_MS : MARQUEE_STEP_MS);
    drawMarquee(m);
    changed = true;
  }
  if (changed) paint();
  requestAnimationFrame(animate);
}

// ---- StockholmTheme::render ----
function render() {
  frame = new Uint8Array(PANEL_W * PANEL_H);
  const rows = Math.min(config.rows, 2);
  const deps = stopData.departures;
  const used = [false, false];

  if (!deps.length) {
    drawText(0, 4, panelText(lastFetchOk ? 'Väntar på tåg' : 'Ingen kontakt med SL'));
    if (rows > 1 && stopData.stopName) { placeText(0, ROW_H + 4, PANEL_W, panelText(stopData.stopName), 1); used[1] = true; }
  } else {
    for (let row = 0; row < rows; row++) {
      const y = row * ROW_H + 4;
      if (!lastFetchOk && row === 1) { drawText(0, y, panelText('Ingen anslutning')); continue; }
      if (row >= deps.length) continue;
      const d = deps[row];
      const line = panelText(d.line), time = panelText(d.displayTime);
      const timeX = PANEL_W - time.length * CHAR_W;
      const destX = (line.length + 1) * CHAR_W;
      drawText(0, y, line);
      drawText(timeX, y, time);
      placeText(destX, y, timeX - TIME_GAP - destX, panelText(d.destination), row);
      used[row] = true;
    }
  }
  used.forEach((u, slot) => { if (!u) marquees[slot] = null; });
  paint();
}

// Pre-rendered LED sprites keep 25 fps marquee repaints cheap.
let sprites = null, spriteLevel = -1;
function ledSprite(color) {
  const c = document.createElement('canvas'); c.width = c.height = LED;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, LED, LED);
  g.fillStyle = color; g.beginPath(); g.arc(LED / 2, LED / 2, LED * 0.4, 0, Math.PI * 2); g.fill();
  return c;
}
function paint() {
  const level = 0.18 + 0.82 * (config.brightness / 255);
  const [r, g, b] = AMBER;
  if (!sprites || spriteLevel !== level) {
    sprites = [ledSprite('#160d05'), ledSprite(`rgba(${r},${g},${b},${level})`)];
    spriteLevel = level;
  }
  for (let y = 0; y < PANEL_H; y++) {
    for (let x = 0; x < PANEL_W; x++) ctx.drawImage(sprites[frame[y * PANEL_W + x]], x * LED, y * LED);
  }
  // Seam between the two chained 64x32 panels.
  ctx.fillStyle = '#0a0a08';
  ctx.fillRect(64 * LED - 1, 0, 2, PANEL_H * LED);
}

// ---- SlTransportAdapter ----
async function request(siteId) {
  if (offline) throw new Error('Wi-Fi frånkopplat');
  let res;
  try {
    res = await fetch(`https://transport.integration.sl.se/v1/sites/${siteId}/departures`);
  } catch (e) { throw new Error('SL API ' + e.message); }
  if (!res.ok) throw new Error('SL API HTTP ' + res.status);
  return res.json();
}

async function fetchDepartures() {
  const doc = await request(config.site);
  const result = { departures: [], stopName: '' };
  for (const item of doc.departures || []) {
    if (!result.stopName) result.stopName = item.stop_area?.name || '';
    if (item.line?.transport_mode !== 'METRO' || item.stop_point?.designation !== config.platform) continue;
    if (item.state === 'CANCELLED' || item.state === 'PASSED') continue;
    const line = item.line?.designation || '?';
    if (config.line && line !== config.line) continue;
    result.departures.push({ line, destination: item.destination || 'Okänd', displayTime: item.display || '-- min' });
  }
  return result;
}

async function fetchPlatforms(siteId) {
  const doc = await request(siteId);
  const map = new Map();
  for (const item of doc.departures || []) {
    const p = item.stop_point?.designation;
    if (item.line?.transport_mode !== 'METRO' || !p) continue;
    if (!map.has(p)) map.set(p, { p, lines: [], dest: [] });
    const entry = map.get(p);
    const line = item.line?.designation || '?';
    if (!entry.lines.includes(line)) entry.lines.push(line);
    if (item.destination && !entry.dest.includes(item.destination)) entry.dest.push(item.destination);
  }
  return [...map.values()].sort((a, b) => a.p.localeCompare(b.p));
}

// ---- main.cpp: updateDepartures + loop ----
async function updateDepartures() {
  lastFetchMs = now();
  try {
    stopData = await fetchDepartures();
    lastFetchOk = true;
    lastSuccessMs = lastFetchMs;
    log(`SL OK: ${stopData.stopName || 'site ' + config.site}, spår ${config.platform}` +
        `${config.line ? ', linje ' + config.line : ''} – ${stopData.departures.length} avgångar`);
  } catch (e) {
    lastFetchOk = false;
    log('SL update failed: ' + e.message);
  }
  render();
}

function tick() {
  const t = now();
  if (t - lastFetchMs >= POLL_MS) updateDepartures();
  if (stopData.departures.length && t - lastSuccessMs >= STALE_MS) {
    stopData.departures = [];
    log('Avgångar äldre än 3 min – rensar skylten');
    render();
  }
  renderStatusBar();
}

function renderStatusBar() {
  const t = now();
  const status = document.createElement('span');
  status.className = lastFetchOk ? 'ok' : 'bad';
  status.textContent = '● ' + tr(lastFetchOk ? 'slOk' : 'slFail');
  $('fetchStatus').replaceChildren(status);
  $('lastFetch').textContent = lastSuccessMs ? tr('lastFetch').replace('{s}', Math.round((t - lastSuccessMs) / 1000)) : '';
  $('nextFetch').textContent = tr('nextFetch').replace('{s}', Math.max(0, Math.ceil((POLL_MS - (t - lastFetchMs)) / 1000)));
}

let lang = 'sv';
try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
if (!T[lang]) { const n = (navigator.language || '').slice(0, 2); lang = T[n] ? n : 'sv'; }
const tr = key => T[lang][key] || T.sv[key];
let platformState = 'loading', platformError = '';

function applyLang() {
  document.documentElement.lang = lang;
  $('lang').value = lang;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tr(e.dataset.t); });
  $('offline').textContent = tr(offline ? 'offlineOff' : 'offlineOn');
  renderPlatforms();
  renderStatusBar();
}
$('lang').onchange = () => {
  lang = $('lang').value;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
};

// ---- Settings UI (same flow as the ESP32 setup page, applied live) ----
function option(select, value, text) {
  const o = document.createElement('option'); o.value = value; o.textContent = text; select.appendChild(o);
}
function fillLines() {
  const p = platforms.find(x => x.p === $('platform').value);
  $('line').replaceChildren(); option($('line'), '', tr('allLines'));
  (p ? p.lines : []).forEach(l => option($('line'), l, tr('lineN') + ' ' + l));
  $('line').value = config.line && [...$('line').options].some(o => o.value === config.line) ? config.line : '';
}
function renderPlatforms() {
  const sel = $('platform');
  sel.replaceChildren();
  $('platformWarn').textContent = '';
  if (platformState === 'loading') { option(sel, '', tr('loading')); sel.disabled = true; fillLines(); return; }
  platforms.forEach(p => option(sel, p.p, `${tr('platformN')} ${p.p} · ${tr('toward')} ${p.dest.slice(0, 3).join(', ')}`));
  if (!platforms.length) {
    for (let i = 1; i <= 4; i++) option(sel, String(i), tr('platformN') + ' ' + i);
    $('platformWarn').textContent = platformError ? tr('platformsError') + platformError : tr('noPlatforms');
  }
  if (![...sel.options].some(o => o.value === config.platform)) config.platform = sel.options[0].value;
  sel.value = config.platform;
  sel.disabled = false;
  fillLines();
}
async function loadPlatforms() {
  platformState = 'loading'; platformError = ''; renderPlatforms();
  try {
    platforms = await fetchPlatforms(config.site);
  } catch (e) {
    platforms = [];
    platformError = e.message;
  }
  platformState = 'ready';
  renderPlatforms();
}
function applySource() {
  stopData = { departures: [], stopName: '' };
  render();
  updateDepartures();
}

STATIONS.split(';').map(s => s.split('|')).sort((a, b) => a[1].localeCompare(b[1], 'sv'))
  .forEach(([id, name]) => option($('site'), id, name));
$('site').value = config.site;

$('site').onchange = async () => {
  config.site = Number($('site').value); config.platform = ''; config.line = '';
  await loadPlatforms(); applySource();
};
$('platform').onchange = () => { config.platform = $('platform').value; config.line = ''; fillLines(); applySource(); };
$('line').onchange = () => { config.line = $('line').value; applySource(); };
$('rows').onchange = () => { config.rows = Number($('rows').value); render(); };
$('brightness').oninput = () => { config.brightness = Number($('brightness').value); $('brightnessValue').value = config.brightness; paint(); };
$('fetchNow').onclick = () => updateDepartures();
$('offline').onclick = () => {
  offline = !offline;
  $('offline').setAttribute('aria-pressed', offline);
  $('offline').textContent = tr(offline ? 'offlineOff' : 'offlineOn');
  log(offline ? 'Wi-Fi frånkopplat (simulerat)' : 'Wi-Fi connected (simulerat)');
  if (!offline) updateDepartures();  // main.cpp fetches immediately on reconnect
};
$('skip').onclick = () => { clockOffset += STALE_MS; log('Klockan +3 min'); tick(); };

applyLang();
render();
requestAnimationFrame(animate);
loadPlatforms().then(() => { updateDepartures(); setInterval(tick, 1000); });
